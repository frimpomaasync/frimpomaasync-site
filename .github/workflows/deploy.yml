name: Deploy frimpomaasync.com to Hostinger
# Every push to main uploads the site to public_html on Hostinger.
# Needs repo secrets: FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
# The FTP root already IS public_html, so server-dir stays ./
#
# DELETION BEHAVIOUR (corrected 2026-07-22 - the previous note here was wrong):
# This action keeps a .ftp-deploy-sync-state.json on the server and DOES delete
# files it previously uploaded, once they leave the repo. Removing Som.zip from
# the repo deleted it from the live server within a minute.
# What it does NOT touch is anything it never uploaded - so the hand-uploaded
# NanaOS folder (os-fad13324c3/) really is safe, just not for the reason the
# old comment gave. If you retire a file people may still hold a link to, add a
# redirect in .htaccess rather than assuming the old URL survives.
on:
  push:
    branches: [main]
  workflow_dispatch:

# FLAKINESS, not breakage (measured 2026-07-27): across 57 runs this workflow
# succeeded 49 times and failed 8. The recent failures (#50, #51, #53, #56) are
# all Hostinger's FTP endpoint timing out, and every one of them succeeded on a
# manual re-run minutes later with no code change. Raising `timeout` fixed the
# control-socket variant but not ETIMEDOUT-before-connect, because that one is
# Hostinger refusing the connection rather than a slow transfer.
#
# So: retry instead of re-triggering by hand. Three attempts with a pause
# between. This is what stops the "Re-trigger deploy" commits, and it means a
# single blip no longer looks like a broken site in the morning inbox.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Production gets the same gate as staging. static_check also runs PHP
      # syntax checks and the full Soft Appeals suite when PHP is available on
      # the runner. Nothing reaches Hostinger if any check exits non-zero.
      - name: Schema check
        run: python3 tests/SoftAppeals/schema_check.py

      - name: Static, PHP and application checks
        run: python3 tests/SoftAppeals/static_check.py

      - name: Refuse to deploy a committed secret
        run: python3 tests/SoftAppeals/secret_scan.py

      - name: Upload via FTPS
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          # Hostinger's control socket drops on bigger batches; the default
          # 30s timeout is what produced "Error: Timeout (control socket)"
          # on runs #50 and #51 (2026-07-26). 3 minutes gives it room.
          timeout: 180000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.bak

      - name: Wait, then retry (attempt 2)
        if: steps.ftp1.outcome == 'failure'
        run: sleep 45

      - name: Upload via FTPS, attempt 2
        id: ftp2
        continue-on-error: true
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          timeout: 180000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.bak

      - name: Wait, then retry (attempt 3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 120

      - name: Upload via FTPS, attempt 3
        id: ftp3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          timeout: 180000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.bak

      # Attempts 1 and 2 swallow their own failure, so the job would otherwise
      # report success even when nothing uploaded. Fail loudly if all three lost.
      - name: Report
        if: always()
        run: |
          if [ "${{ steps.ftp1.outcome }}" = "success" ]; then
            echo "Deployed on the first attempt."
          elif [ "${{ steps.ftp2.outcome }}" = "success" ]; then
            echo "::warning::Hostinger FTP failed once, second attempt deployed."
          elif [ "${{ steps.ftp3.outcome }}" = "success" ]; then
            echo "::warning::Hostinger FTP failed twice, third attempt deployed."
          else
            echo "::error::All three FTP attempts failed. This is not the usual blip."
            exit 1
          fi
