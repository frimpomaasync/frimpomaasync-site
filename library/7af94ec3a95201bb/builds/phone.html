<title>The Build Library</title>
<style>
:root{
  --ink:#101426; --copper:#C2501C; --paper:#FFFFFF; --wash:#F8F8F9;
  --line:#E4E4EA; --mute:#6A6E7E; --soft:#9A9EAC;
  --live:#1E7A4C; --built:#B07A12; --shelf:#6A6E7E; --dead:#B33A3A;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--wash);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--copper);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:18px 20px 12px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
h1{font-family:var(--serif);font-size:30px;line-height:1.15;margin:6px 0 2px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.searchrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#q{flex:1 1 260px;min-width:0;font-size:16px;font-family:var(--sans);padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--wash);color:var(--ink);outline:none}
#q:focus{border-color:var(--copper);background:var(--paper)}
.count{font-family:var(--mono);font-size:11.5px;color:var(--soft);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--mute);cursor:pointer;user-select:none;line-height:1.2}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- grid ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.groupname{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:26px 0 10px;border-top:1px solid var(--line);padding-top:16px}
.groupname:first-of-type{margin-top:4px;border-top:0;padding-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 16px 13px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--ink);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kind{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;font-weight:600}
.pill.live{background:#E8F4ED;color:var(--live)}
.pill.built{background:#FBF2DF;color:var(--built)}
.pill.shelved{background:#EFEFF2;color:var(--shelf)}
.pill.retired{background:#F8EAEA;color:var(--dead)}
.cname{font-family:var(--serif);font-size:19px;line-height:1.25;font-weight:600;letter-spacing:-.005em}
.cone{color:var(--mute);font-size:13.5px;line-height:1.5;flex:1}
.cfoot{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--soft);border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
.cfoot .go{color:var(--copper);font-weight:600}
.empty{color:var(--mute);padding:40px 0;text-align:center;font-size:15px}

/* ---------- detail ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:var(--wash);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.sheet.open{display:block}
.sbar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:12px}
.back{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.back:hover{border-color:var(--ink)}
.sbar .nm{font-family:var(--serif);font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sin{max-width:1000px;margin:0 auto;padding:22px 20px 80px}
.sin h2{font-family:var(--serif);font-size:31px;line-height:1.15;margin:8px 0 6px;font-weight:600;letter-spacing:-.01em}
.sone{font-size:16px;color:var(--mute);margin:0 0 18px;max-width:64ch}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.btn{font-family:var(--sans);font-size:14px;font-weight:600;padding:10px 15px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
.btn:hover{text-decoration:none;opacity:.88}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.copper{background:var(--copper);border-color:var(--copper)}
.btn.ghost{background:var(--paper);color:var(--mute);border-color:var(--line)}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink);opacity:1}

.pv{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
.pvh{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pvh .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);flex:1}
.tog{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tog button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border:0;background:var(--paper);color:var(--mute);cursor:pointer}
.tog button.on{background:var(--ink);color:#fff}
.pvbody{background:#EDEDF1;padding:14px;display:flex;justify-content:center}
.pvbody iframe{border:0;background:#fff;width:100%;height:560px;border-radius:8px;box-shadow:0 1px 3px rgba(16,20,38,.14)}
.pvbody.phone iframe{width:390px;max-width:100%;height:640px}
.pvnote{padding:16px;color:var(--mute);font-size:14px;background:var(--paper)}

.sec{margin-bottom:22px}
.sec h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:0 0 9px;font-weight:600}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.box ol,.box ul{margin:0;padding-left:19px}
.box li{margin-bottom:7px}
.box li:last-child{margin-bottom:0}
.box p{margin:0 0 8px}
.box p:last-child{margin:0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 14px;font-size:14px}
.kv dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);padding-top:3px}
.kv dd{margin:0;word-break:break-word}
code,.path{font-family:var(--mono);font-size:12.5px;background:var(--wash);border:1px solid var(--line);border-radius:6px;padding:2px 6px;word-break:break-all}
.fline{display:flex;gap:8px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.fline:last-child{margin-bottom:0}
.cp{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--mute);cursor:pointer;white-space:nowrap}
.cp:hover{border-color:var(--ink);color:var(--ink)}
.cp.done{border-color:var(--live);color:var(--live)}
.warn{background:#FDF6EE;border-color:#F0DCC6}
details.ret{margin-top:8px}
details.ret summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);padding:10px 0}
details.ret summary:hover{color:var(--ink)}
.retlist{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 17px;font-size:13.5px;color:var(--mute)}
.retlist b{color:var(--ink);font-weight:600}
.retlist div{margin-bottom:9px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;padding:11px 18px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modebar{background:#FDF6EE;border-bottom:1px solid #F0DCC6;font-size:13px;color:#7A5A2E;padding:9px 20px;text-align:center}

@media (max-width:640px){
  .wrap{padding:14px}
  .top .in{padding:14px 14px 10px}
  h1{font-size:25px}
  .grid{grid-template-columns:1fr;gap:10px}
  .sin{padding:16px 14px 70px}
  .sin h2{font-size:25px}
  .pvbody{padding:8px}
  .pvbody iframe{height:70vh}
  .pvbody.phone iframe{height:70vh}
  .kv{grid-template-columns:1fr;gap:3px 0}
  .kv dd{margin-bottom:8px}
  .btn{width:100%;text-align:center}
}
</style>
<div id="modebar" class="modebar" hidden></div>

<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">

    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Could not copy'); }
    document.body.removeChild(ta);
  }

  /* ---------- chips ---------- */
  function buildChips(){
    var html = '<span class="chip' + (filter==='all'?' on':'') + '" data-f="all">Everything</span>';
    GROUPS.forEach(function(g){
      var n = BUILDS.filter(function(b){ return b.group === g; }).length;
      html += '<span class="chip' + (filter===g?' on':'') + '" data-f="' + esc(g) + '">' + esc(SHORT[g]) + ' · ' + n + '</span>';
    });
    chips.innerHTML = html;
    Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function(c){
      c.addEventListener('click', function(){ filter = c.getAttribute('data-f'); buildChips(); render(); });
    });
  }

  /* ---------- grid ---------- */
  function matches(b, term){
    if(!term) return true;
    var hay = (b.name + ' ' + b.one + ' ' + b.kind + ' ' + b.group + ' ' + (b.where||'') + ' ' +
               (b.live||'') + ' ' + (b.files||[]).join(' ') + ' ' + (b.use||[]).join(' ') + ' ' +
               (b.update||[]).join(' ') + ' ' + (b.watch||[]).join(' ')).toLowerCase();
    return term.toLowerCase().split(/\s+/).every(function(w){ return hay.indexOf(w) > -1; });
  }

  function card(b){
    return '<div class="card" tabindex="0" data-id="' + b.id + '">' +
      '<div class="crow"><span class="kind">' + esc(b.kind) + '</span>' +
      '<span class="pill ' + b.status + '">' + STATUSWORD[b.status] + '</span></div>' +
      '<div class="cname">' + esc(b.name) + '</div>' +
      '<div class="cone">' + esc(b.one) + '</div>' +
      '<div class="cfoot"><span class="go">Open →</span><span>' + (b.files ? b.files.length + ' file' + (b.files.length===1?'':'s') : '') + '</span></div>' +
      '</div>';
  }

  function render(){
    var term = q.value.trim();
    var list = BUILDS.filter(function(b){ return (filter==='all' || b.group===filter) && matches(b, term); });
    $('#count').textContent = list.length + ' of ' + BUILDS.length;

    if(!list.length){ main.innerHTML = '<p class="empty">Nothing matches “' + esc(term) + '”.</p>'; return; }

    var html = '';
    GROUPS.forEach(function(g){
      var inG = list.filter(function(b){ return b.group === g; });
      if(!inG.length) return;
      html += '<h2 class="groupname">' + esc(g) + '</h2><div class="grid">' + inG.map(card).join('') + '</div>';
    });

    if(filter === 'all' && !term){
      html += '<details class="ret"><summary>Retired · ' + RETIRED.length + ' things that are dead, listed so you know they are dead and not lost</summary>' +
              '<div class="retlist">' + RETIRED.map(function(r){ return '<div><b>' + esc(r[0]) + '</b> · ' + esc(r[1]) + '</div>'; }).join('') + '</div></details>';
    }
    main.innerHTML = html;

    Array.prototype.forEach.call(main.querySelectorAll('.card'), function(c){
      var go = function(){ open(c.getAttribute('data-id')); };
      c.addEventListener('click', go);
      c.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } });
    });
  }

  /* ---------- detail ---------- */
  function listBox(items, cls){
    if(!items || !items.length) return '';
    return '<div class="box' + (cls?' '+cls:'') + '"><ul>' + items.map(function(i){ return '<li>' + i + '</li>'; }).join('') + '</ul></div>';
  }
  function stepBox(items){
    if(!items || !items.length) return '';
    return '<div class="box"><ol>' + items.map(function(i){ return '<li>' + i + '</li>'; }).join('') + '</ol></div>';
  }

  function open(id){
    var b = BUILDS.filter(function(x){ return x.id === id; })[0];
    if(!b) return;
    var h = '';

    h += '<div class="crow" style="justify-content:flex-start;gap:9px"><span class="kind">' + esc(b.kind) +
         '</span><span class="pill ' + b.status + '">' + STATUSWORD[b.status] + '</span></div>';
    h += '<h2>' + esc(b.name) + '</h2><p class="sone">' + esc(b.one) + '</p>';

    /* buttons */
    h += '<div class="btns">';
    if(b.live) h += '<a class="btn copper" href="' + esc(b.live) + '" target="_blank" rel="noopener">Open live →</a>';
    if(b.prev && LOCAL) h += '<a class="btn alt" href="' + fileURL(b.prev) + '" target="_blank">Open the file on this Mac →</a>';
    if(b.files && b.files.length){
      h += '<button class="btn ghost" data-copy="' + esc(folder(b.files[0])) + '">Copy the folder</button>';
      if(b.prev) h += '<button class="btn ghost" data-copy="' + esc('open -a &quot;Google Chrome&quot; &quot;' + b.prev + '&quot;').replace(/&quot;/g,'"') + '">Copy the open command</button>';
    }
    h += '</div>';

    /* preview */
    if(b.prev){
      if(LOCAL){
        h += '<div class="pv"><div class="pvh"><span class="lbl">Live preview · the copy on this Mac</span>' +
             '<div class="tog"><button data-w="desk" class="on">Desktop</button><button data-w="phone">Phone</button></div>' +
             '<button class="cp" id="pvreload">Reload</button></div>' +
             '<div class="pvbody" id="pvbody"><iframe id="pvframe" src="' + prevURL(b.prev) + '" title="preview"></iframe></div></div>';
      } else {
        h += '<div class="pv"><div class="pvh"><span class="lbl">Preview</span></div>' +
             '<div class="pvnote">Live previews run only in the Mac copy of this page. Use <b>Open live →</b> above, or open <code>~/Downloads/build-library/BUILD-LIBRARY.html</code> on the Mac.</div></div>';
      }
    } else if(b.live){
      h += '<div class="pv"><div class="pvh"><span class="lbl">Preview</span></div>' +
           '<div class="pvnote">This one has no page to frame. Use <b>Open live →</b> above.</div></div>';
    }

    /* sections */
    if(b.where) h += '<div class="sec"><h3>Where it lives</h3><div class="box"><p>' + b.where + '</p></div></div>';
    if(b.use)    h += '<div class="sec"><h3>How to use it</h3>' + listBox(b.use) + '</div>';
    if(b.update) h += '<div class="sec"><h3>How to change it</h3>' + stepBox(b.update) + '</div>';
    if(b.watch)  h += '<div class="sec"><h3>Watch out</h3>' + listBox(b.watch, 'warn') + '</div>';

    if(b.files && b.files.length){
      h += '<div class="sec"><h3>Files · ' + b.files.length + '</h3><div class="box">';
      b.files.forEach(function(f){
        h += '<div class="fline">' +
             (LOCAL ? '<a class="path" href="' + fileURL(f) + '" target="_blank">' + esc(base(f)) + '</a>' : '<span class="path">' + esc(base(f)) + '</span>') +
             '<span style="color:var(--soft);font-size:12px;flex:1;min-width:0;word-break:break-all">' + esc(f) + '</span>' +
             '<button class="cp" data-copy="' + esc(f) + '">Copy</button></div>';
      });
      h += '</div></div>';
    }

    sheetBody.innerHTML = h;
    sheetName.textContent = b.name;
    sheet.classList.add('open');
    sheet.scrollTop = 0;
    document.body.style.overflow = 'hidden';

    Array.prototype.forEach.call(sheetBody.querySelectorAll('[data-copy]'), function(btn){
      btn.addEventListener('click', function(){ copy(btn.getAttribute('data-copy'), btn); });
    });
    var togs = sheetBody.querySelectorAll('.tog button');
    Array.prototype.forEach.call(togs, function(t){
      t.addEventListener('click', function(){
        Array.prototype.forEach.call(togs, function(x){ x.classList.remove('on'); });
        t.classList.add('on');
        $('#pvbody').className = 'pvbody' + (t.getAttribute('data-w') === 'phone' ? ' phone' : '');
      });
    });
    var rl = sheetBody.querySelector('#pvreload');
    if(rl) rl.addEventListener('click', function(){ var f = $('#pvframe'); f.src = f.src; });

    /* If the preview server is not answering, say so plainly and give her the
       one line that starts it, rather than showing an empty white frame. */
    if(b.prev && LOCAL && isSitePage(b.prev)){
      var probe = new Image(), settled = false;
      var down = function(){
        if(settled) return; settled = true;
        var body = $('#pvbody'); if(!body) return;
        body.outerHTML = '<div class="pvnote"><b>The preview server is not running.</b>' +
          '<br>That is the only reason this frame is empty. The page itself is fine.' +
          '<br><br>Paste this into Terminal once and it comes back, and stays back:' +
          '<div class="fline" style="margin-top:8px"><span class="path">launchctl load ~/Library/LaunchAgents/com.frimpomaasync.preview-server.plist</span>' +
          '<button class="cp" id="cpsrv">Copy</button></div></div>';
        var c = $('#cpsrv');
        if(c) c.addEventListener('click', function(){
          copy('launchctl load ~/Library/LaunchAgents/com.frimpomaasync.preview-server.plist', c); });
      };
      probe.onload = function(){ settled = true; };
      probe.onerror = down;
      probe.src = SERVE + 'favicon.svg?probe=' + (new Date()).getTime();
      setTimeout(function(){ if(!settled) down(); }, 3000);
    }
  }

  function close(){
    sheet.classList.remove('open');
    sheetBody.innerHTML = '';
    document.body.style.overflow = '';
  }

  $('#back').addEventListener('click', close);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && sheet.classList.contains('open')) close();
    if(e.key === '/' && document.activeElement !== q && !sheet.classList.contains('open')){ e.preventDefault(); q.focus(); }
  });
  q.addEventListener('input', render);

  buildChips();
  render();
})();
</script>
