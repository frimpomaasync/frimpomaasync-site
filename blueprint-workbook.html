  <script>
(function () {
  var KEY = 'fs-blueprint-v1', DONE = 'fs-blueprint-events';
  function already() { try { return JSON.parse(localStorage.getItem(DONE)) || {}; } catch (e) { return {}; } }
  function send(name, once) {
    var d = already();
    if (once && d[name]) return;
    if (once) { d[name] = 1; try { localStorage.setItem(DONE, JSON.stringify(d)); } catch (e) {} }
    try {
      navigator.sendBeacon('/event.php', new Blob(
        [JSON.stringify({ e: name, p: location.pathname })], { type: 'application/json' }));
    } catch (e) {}
  }
  function check() {
    var s;
    try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return; }
    var a = s.audit || [], n = 0, i;
    for (i = 0; i < a.length; i++) { if (a[i]) n++; }
    if (n > 0) send('audit_started', true);
    if (n >= 12) send('audit_completed', true);
  }
  setInterval(check, 2500);
  document.addEventListener('visibilitychange', check);
  var ctaSent = false;
  document.addEventListener('click', function (ev) {
    var el = ev.target, href = '';
    while (el && el !== document) {
      if (el.tagName === 'A' && el.getAttribute('href')) { href = el.getAttribute('href'); break; }
      el = el.parentNode;
    }
    if (!href || ctaSent) return;
    if (/\/(synkasa|operations-map|book)(\/|$|\?|#)/.test(href)) { ctaSent = true; send('blueprint_cta', false); }
  }, true);
})();

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt=\"summary_large_image\">\n<script src=\"075e453c-68de-4f82-85d9-c48bee615481\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>\ndoc-page:not(:defined){visibility:hidden}\nhtml,body{margin:0;padding:0}\nbody{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#101426}\na{color:#101426;text-decoration:none}a:hover{color:#C2501C}\ninput,textarea{font-family:inherit;color:#101426}\ninput::placeholder,textarea::placeholder{color:#a6a9b4}\ninput:focus,textarea:focus{outline:1px solid #C2501C}\n<\u002Fstyle>\n<script src=\"251e08e2-745b-4b27-8217-238162ac29d4\"><\u002Fscript>\n<\u002Fhelmet>\n<doc-page size=\"letter\">\n\n<section class=\"page\" id=\"p1\" data-screen-label=\"Cover + Audit\" style=\"padding:.45in;box-sizing:border-box;display:flex;flex-direction:column;background:#F2F3F6\">\n  <div style=\"background:#101426;color:#fff;border-radius:16pt;padding:16pt 20pt;display:flex;justify-content:space-between;align-items:center;gap:14pt;flex-shrink:0\">\n    <div>\n      <div style=\"display:flex;align-items:center;gap:7pt;margin-bottom:8pt\">\n        <img src=\"7d7ce16d-35b2-4bc9-955f-8866e4389f96\" alt=\"frimpomaasync\" style=\"width:15pt;height:15pt;object-fit:contain;background:#fff;border-radius:3pt;padding:1.5pt\">\n        <a href=\"/blueprint\" style=\"font-weight:700;font-size:10pt;color:inherit;text-decoration:none\">frimpomaasync<\u002Fa>\n        <span style=\"font-size:8pt;font-weight:600;color:#a9adbb;background:rgba(255,255,255,.1);border-radius:99pt;padding:3pt 8pt\">Fillable Workbook<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-weight:500;font-size:19pt;line-height:1.1;letter-spacing:-.02em\">The Automated Small Business Blueprint \u00b7 <span style=\"color:#C2501C\">Systems that Run Without You.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:right;font-size:8.5pt;color:#a9adbb;line-height:1.5;white-space:nowrap\">12 tasks \u00b7 4 systems \u00b7 7 days<br>Coordinated with the<br>interactive Command Center<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border-radius:16pt;padding:14pt 18pt;margin-top:9pt;flex:1;display:flex;flex-direction:column\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10pt\">\n      <div style=\"font-weight:500;font-size:16pt;letter-spacing:-.02em\">The System vs. You <span style=\"background:#F6E7DC;border-radius:5pt;padding:0 5pt\">Audit<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:8.5pt;color:#8a8e9c\">Check one column per task. A system counts only when it does the task instead of you.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 58pt 58pt 58pt;gap:0 8pt;font-size:7.5pt;font-weight:600;color:#8a8e9c;border-bottom:1.5pt solid #101426;padding-bottom:4pt;margin-top:8pt\">\n      <span>Task<\u002Fspan><span style=\"text-align:center\">Manual<\u002Fspan><span style=\"text-align:center\">Partly<\u002Fspan><span style=\"text-align:center\">Runs w/o me<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1\">\n      <sc-for list=\"{{ auditRows }}\" as=\"row\" hint-placeholder-count=\"12\">\n        <div style=\"display:grid;grid-template-columns:1fr 58pt 58pt 58pt;gap:0 8pt;align-items:center;border-bottom:1pt solid #eeeff2;padding:4.5pt 0\">\n          <div style=\"display:flex;align-items:baseline;gap:7pt\"><span style=\"font-size:7pt;font-weight:600;color:#a6a9b4;white-space:nowrap\">{{ row.module }}<\u002Fspan><span style=\"font-size:10pt;font-weight:600\">{{ row.label }}<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ row.opts }}\" as=\"opt\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ opt.on }}\" style=\"justify-self:center;width:13pt;height:13pt;border:1.5pt solid #d6d8de;border-radius:4pt;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:9pt;cursor:pointer;background:{{ opt.bg }};color:{{ opt.fg }}\">{{ opt.mark }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"background:#101426;color:#fff;border-radius:11pt;padding:9pt 14pt;margin-top:8pt;display:flex;justify-content:space-between;align-items:center;gap:12pt\">\n      <div style=\"font-size:8.5pt;font-weight:600;opacity:.65\">Independence score<\u002Fdiv>\n      <div style=\"font-weight:500;font-size:15pt;letter-spacing:-.01em;color:#C2501C\">{{ scoreLine }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;padding:8pt 4pt 0;font-size:8pt;font-weight:600;color:#8a8e9c\"><span>frimpomaasync.com<\u002Fspan><span>Page 1 of 4<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" id=\"p2\" data-screen-label=\"Modules\" style=\"padding:.45in;box-sizing:border-box;display:flex;flex-direction:column;background:#F2F3F6\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10pt;padding:0 4pt 8pt\">\n    <div style=\"font-weight:500;font-size:16pt;letter-spacing:-.02em\">Four System <span style=\"background:#F6E7DC;border-radius:5pt;padding:0 5pt\">Module Workspaces<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:8.5pt;color:#8a8e9c\">Check tasks as they go live \u00b7 fill the worksheet per module<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:9pt;flex:1;min-height:0\">\n    <sc-for list=\"{{ modulePages }}\" as=\"mp\" hint-placeholder-count=\"4\">\n      <div style=\"background:#fff;border-radius:14pt;padding:11pt 13pt;display:flex;flex-direction:column;min-height:0\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8pt\">\n          <span style=\"font-size:7.5pt;font-weight:600;color:#7d3413;background:#F6E7DC;border-radius:99pt;padding:2.5pt 8pt\">Module 0{{ mp.num }} \u00b7 {{ mp.domain }}<\u002Fspan>\n          <span style=\"font-size:7.5pt;font-weight:600;color:#a6a9b4\">{{ mp.countLine }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-weight:600;font-size:12.5pt;letter-spacing:-.01em;margin:6pt 0 1pt\">{{ mp.name }}<\u002Fdiv>\n        <div style=\"font-size:8pt;color:#8a8e9c;margin-bottom:4pt\">{{ mp.tagline }}<\u002Fdiv>\n        <div style=\"font-size:7.5pt;line-height:1.4;color:#3d4150;margin-bottom:4pt\"><span style=\"font-weight:700;color:#C2501C\">Problem: <\u002Fspan>{{ mp.problem }} <span style=\"font-weight:700\">The system: <\u002Fspan>{{ mp.solution }}<\u002Fdiv>\n        <sc-for list=\"{{ mp.tasks }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:7pt;align-items:center;border-bottom:1pt solid #eeeff2;padding:3pt 0\">\n            <div sc-camel-on-click=\"{{ t.on }}\" style=\"width:12pt;height:12pt;border:1.5pt solid #d6d8de;border-radius:4pt;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:8.5pt;cursor:pointer;background:{{ t.bg }};color:{{ t.fg }}\">{{ t.mark }}<\u002Fdiv>\n            <div style=\"font-size:8.5pt;line-height:1.3\"><span style=\"font-weight:600\">{{ t.label }}<\u002Fspan><span style=\"color:#8a8e9c\"> \u00b7 {{ t.desc }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:4pt 8pt;margin-top:6pt;flex:1;grid-template-rows:1fr auto auto;align-content:stretch\">\n          <div style=\"display:flex;flex-direction:column\"><div style=\"font-size:6.5pt;font-weight:600;color:#8a8e9c;margin-bottom:1pt\">Current process<\u002Fdiv><textarea aria-label=\"Current process\" value=\"{{ mp.f.current.v }}\" sc-camel-on-change=\"{{ mp.f.current.on }}\" style=\"flex:1;width:100%;box-sizing:border-box;border:1pt solid #e2e3e8;border-radius:8pt;background:#f3f4f6;font-size:8.5pt;line-height:13pt;resize:none;padding:5pt 8pt;min-height:34pt\"><\u002Ftextarea><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column\"><div style=\"font-size:6.5pt;font-weight:600;color:#8a8e9c;margin-bottom:1pt\">Future system<\u002Fdiv><textarea aria-label=\"Future system\" value=\"{{ mp.f.automate.v }}\" sc-camel-on-change=\"{{ mp.f.automate.on }}\" style=\"flex:1;width:100%;box-sizing:border-box;border:1pt solid #e2e3e8;border-radius:8pt;background:#f3f4f6;font-size:8.5pt;line-height:13pt;resize:none;padding:5pt 8pt;min-height:34pt\"><\u002Ftextarea><\u002Fdiv>\n          <div><div style=\"font-size:6.5pt;font-weight:600;color:#8a8e9c;margin-bottom:1pt\">Tool / person<\u002Fdiv><input aria-label=\"Tool or person\" value=\"{{ mp.f.tool.v }}\" sc-camel-on-change=\"{{ mp.f.tool.on }}\" style=\"width:100%;box-sizing:border-box;border:1pt solid #e2e3e8;border-radius:99pt;background:#f3f4f6;font-size:8.5pt;padding:3.5pt 8pt\"><\u002Fdiv>\n          <div><div style=\"font-size:6.5pt;font-weight:600;color:#8a8e9c;margin-bottom:1pt\">Due date<\u002Fdiv><input aria-label=\"Due date\" value=\"{{ mp.f.due.v }}\" sc-camel-on-change=\"{{ mp.f.due.on }}\" style=\"width:100%;box-sizing:border-box;border:1pt solid #e2e3e8;border-radius:99pt;background:#f3f4f6;font-size:8.5pt;padding:3.5pt 8pt\"><\u002Fdiv>\n          <div><div style=\"font-size:6.5pt;font-weight:600;color:#8a8e9c;margin-bottom:1pt\">Next 1% action<\u002Fdiv><input aria-label=\"Next 1% action\" value=\"{{ mp.f.next.v }}\" sc-camel-on-change=\"{{ mp.f.next.on }}\" style=\"width:100%;box-sizing:border-box;border:1pt solid #e2e3e8;border-radius:99pt;background:#f3f4f6;font-size:8.5pt;padding:3.5pt 8pt\"><\u002Fdiv>\n          <div><div style=\"font-size:6.5pt;font-weight:600;color:#8a8e9c;margin-bottom:1pt\">Notes<\u002Fdiv><input aria-label=\"Notes\" value=\"{{ mp.f.notes.v }}\" sc-camel-on-change=\"{{ mp.f.notes.on }}\" style=\"width:100%;box-sizing:border-box;border:1pt solid #e2e3e8;border-radius:99pt;background:#f3f4f6;font-size:8.5pt;padding:3.5pt 8pt\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:7.5pt;line-height:1.4;color:#43230f;background:#F6E7DC;border-radius:8pt;padding:5pt 8pt;margin-top:6pt\"><span style=\"font-weight:700;color:#C2501C\">Action: <\u002Fspan>{{ mp.action }}<br><span style=\"font-weight:700\">Pro tip: <\u002Fspan>{{ mp.tip }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;padding:8pt 4pt 0;font-size:8pt;font-weight:600;color:#8a8e9c\"><span>The Automated Small Business Blueprint<\u002Fspan><span>Page 2 of 4<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" id=\"p3\" data-screen-label=\"Map + Plan\" style=\"padding:.45in;box-sizing:border-box;display:flex;flex-direction:column;background:#F2F3F6\">\n  <div style=\"background:#fff;border-radius:16pt;padding:12pt 16pt\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10pt;margin-bottom:6pt\">\n      <div style=\"font-weight:500;font-size:15pt;letter-spacing:-.02em\">Manual vs. <span style=\"background:#F6E7DC;border-radius:5pt;padding:0 5pt\">Automated<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:8pt;color:#8a8e9c\">The complete 12-function operating map<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:64pt 1fr 1fr 1fr;gap:0 9pt;font-size:7pt;font-weight:600;color:#8a8e9c;border-bottom:1.5pt solid #101426;padding-bottom:3pt\">\n      <span>Function<\u002Fspan><span>Current process<\u002Fspan><span>Future system<\u002Fspan><span style=\"color:#C2501C\">My first move<\u002Fspan>\n    <\u002Fdiv>\n    <sc-for list=\"{{ mapRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n      <div style=\"display:grid;grid-template-columns:64pt 1fr 1fr 1fr;gap:0 9pt;align-items:center;border-bottom:1pt solid #eeeff2;padding:3.5pt 0\">\n        <div style=\"font-size:8pt;font-weight:700\">{{ r.fn }}<\u002Fdiv>\n        <div style=\"font-size:7.5pt;color:#8a8e9c;line-height:1.3\">{{ r.cur }}<\u002Fdiv>\n        <div style=\"font-size:7.5pt;line-height:1.3;font-weight:500\">{{ r.fut }}<\u002Fdiv>\n        <div style=\"font-size:7.5pt;color:#C2501C;font-weight:600;line-height:1.3\">\u2197 {{ r.move }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border-radius:16pt;padding:12pt 16pt;margin-top:9pt;flex:1;display:flex;flex-direction:column\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10pt;margin-bottom:4pt\">\n      <div style=\"font-weight:500;font-size:15pt;letter-spacing:-.02em\">Seven-Day <span style=\"background:#F6E7DC;border-radius:5pt;padding:0 5pt\">Momentum Plan<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:8pt;color:#8a8e9c\">Pick one leak from the audit and fix it this week. Momentum beats a perfect plan.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1\">\n      <sc-for list=\"{{ planRows }}\" as=\"d\" hint-placeholder-count=\"7\">\n        <div style=\"display:flex;gap:8pt;align-items:center;border-bottom:1pt solid #eeeff2;padding:4pt 0\">\n          <div sc-camel-on-click=\"{{ d.on }}\" style=\"width:13pt;height:13pt;border:1.5pt solid #d6d8de;border-radius:4pt;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:9pt;cursor:pointer;background:{{ d.bg }};color:{{ d.fg }}\">{{ d.mark }}<\u002Fdiv>\n          <div style=\"width:158pt;flex-shrink:0\"><span style=\"font-size:9pt;font-weight:700\">Day {{ d.n }} \u00b7 {{ d.title }}<\u002Fspan><span style=\"font-size:7pt;font-weight:600;color:#a6a9b4\"> \u00b7 {{ d.time }}<\u002Fspan><\u002Fdiv>\n          <input aria-label=\"Action\" value=\"{{ d.action }}\" sc-camel-on-change=\"{{ d.onAction }}\" placeholder=\"Action\u2026\" style=\"flex:1;min-width:0;box-sizing:border-box;border:1pt solid #e2e3e8;border-radius:99pt;background:#f3f4f6;font-size:8.5pt;padding:3.5pt 8pt\">\n          <input aria-label=\"Notes on what happened\" value=\"{{ d.notes }}\" sc-camel-on-change=\"{{ d.onNotes }}\" placeholder=\"Notes\u2026\" style=\"flex:1;min-width:0;box-sizing:border-box;border:1pt solid #e2e3e8;border-radius:99pt;background:#f3f4f6;font-size:8.5pt;padding:3.5pt 8pt\">\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;padding:8pt 4pt 0;font-size:8pt;font-weight:600;color:#8a8e9c\"><span>The Automated Small Business Blueprint<\u002Fspan><span>Page 3 of 4<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" id=\"p4\" data-screen-label=\"Scripts\" style=\"padding:.45in;box-sizing:border-box;display:flex;flex-direction:column;background:#F2F3F6\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10pt;padding:0 4pt 8pt\">\n    <div style=\"font-weight:500;font-size:16pt;letter-spacing:-.02em\">Script <span style=\"background:#F6E7DC;border-radius:5pt;padding:0 5pt\">Library<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:8.5pt;color:#8a8e9c\">Copy the original, then write your version: your name, your hours, your voice.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9pt;flex:1;min-height:0\">\n    <sc-for list=\"{{ scriptPages }}\" as=\"sp\" hint-placeholder-count=\"2\">\n      <div style=\"background:#fff;border-radius:14pt;padding:12pt 14pt;display:flex;flex-direction:column;min-height:0\">\n        <span style=\"font-size:7.5pt;font-weight:600;color:#7c8090;background:#f3f4f6;border-radius:99pt;padding:2.5pt 8pt;align-self:flex-start\">{{ sp.tag }}<\u002Fspan>\n        <div style=\"font-weight:600;font-size:13pt;letter-spacing:-.01em;margin:6pt 0 1pt\">{{ sp.title }}<\u002Fdiv>\n        <div style=\"font-size:7.5pt;color:#8a8e9c;margin-bottom:6pt\"><span style=\"font-weight:600\">Triggers<\u002Fspan> \u00b7 {{ sp.trigger }}<\u002Fdiv>\n        <div style=\"font-size:7pt;font-weight:600;color:#8a8e9c;margin-bottom:2pt\">Original template<\u002Fdiv>\n        <div style=\"background:#f3f4f6;border-radius:9pt;padding:8pt 10pt;font-size:8.5pt;line-height:1.5;white-space:pre-wrap;color:#3d4150\">{{ sp.original }}<\u002Fdiv>\n        <div style=\"font-size:7pt;font-weight:600;color:#C2501C;margin:7pt 0 2pt\">My version<\u002Fdiv>\n        <textarea aria-label=\"My version of the script\" value=\"{{ sp.mine }}\" sc-camel-on-change=\"{{ sp.onMine }}\" style=\"flex:1;width:100%;box-sizing:border-box;border:1pt solid #ebd5c6;border-radius:9pt;background:#F6E7DC;font-size:8.5pt;line-height:14pt;resize:none;padding:8pt 10pt\"><\u002Ftextarea>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"background:#101426;color:#fff;border-radius:14pt;padding:11pt 15pt;margin-top:9pt;display:flex;justify-content:space-between;align-items:center;gap:10pt\">\n    <div style=\"font-size:9pt;line-height:1.45\"><span style=\"font-weight:600\">Would rather not wire it yourself?<\u002Fspan><span style=\"color:#a9adbb\"> SynKasa answers, qualifies and books while your hands stay on the work. Live in 7 days, or you don't pay.<\u002Fspan><\u002Fdiv>\n    <span style=\"font-size:8.5pt;font-weight:600;color:#C2501C;white-space:nowrap\">frimpomaasync.com/synkasa \u2197<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;padding:8pt 4pt 0;font-size:8pt;font-weight:600;color:#8a8e9c\"><span>The Automated Small Business Blueprint<\u002Fspan><span>Page 4 of 4<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdoc-page>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst KEY='fs-blueprint-v1';\nconst MODULES=[\n {name:'The Automated Receptionist',domain:'Calls & Booking',tagline:'Stop losing business to the phone.',\n  problem:'Calls arrive while your hands are busy, and voicemail callers rarely call back.',\n  solution:'Every caller receives an instant reply and a booking link.',\n  action:'Create a 30-second after-hours greeting that states your hours and directs callers to your booking link.',\n  tip:'Mention the text-back feature in the greeting to manage caller expectations.',\n  tasks:[{t:'Missed-call text-back',d:'missed calls automatically receive a text-back'},{t:'Auto-FAQs',d:'the same 10 questions handled via saved auto-replies'},{t:'Frictionless scheduling',d:'a booking link that confirms automatically'}]},\n {name:'The Lead Nurture Engine',domain:'Follow-Up',tagline:'Ensure nothing goes cold.',\n  problem:'Leads slip away because manual follow-up is inconsistent.',\n  solution:'The circle-back is automated from the moment an inquiry lands.',\n  action:'Set up a 2-step sequence: instant text confirmation, then a 24-hour follow-up email if no action is taken.',\n  tip:'Use \u201cWait\u201d steps so follow-ups land during business hours.',\n  tasks:[{t:'Immediate nurture sequence',d:'follow-ups trigger the second an inquiry arrives'},{t:'Review & rebooking messages',d:'scheduled messages ask for you'},{t:'Quote recovery reminders',d:'stalled quotes get a 2-touch reminder'}]},\n {name:'The Frictionless Finance Hub',domain:'Admin & Money',tagline:'Know your numbers without the data entry.',\n  problem:'Manual data entry across multiple tools breeds errors and wasted time.',\n  solution:'One intake form populates every business tool automatically.',\n  action:'Create a Google Form for new clients that connects to a Sheet via Zapier and triggers an invoice draft.',\n  tip:'Set invoices to Draft mode if pricing varies. A 30-second review before dispatch.',\n  tasks:[{t:'Automated invoicing',d:'invoices and payment-due nudges send automatically'},{t:'Unified intake form',d:'one form fills every tool'},{t:'Real-time tracking sheet',d:'numbers live in a self-updating sheet'}]},\n {name:'The Content Vault',domain:'Ideas & Content',tagline:'Catch every idea and eliminate the blank page.',\n  problem:'Great ideas vanish with no immediate way to capture them.',\n  solution:'A single capture spot reachable in under 2 seconds.',\n  action:'Create a Content Ideas folder and bookmark it for 2-second capture, or install Som from your phone browser.',\n  tip:'Tag ideas by bucket (Educational, Social Proof, Sales) at capture.',\n  tasks:[{t:'2-second rapid capture',d:'catch the thought even with no signal'},{t:'Hook swipe file',d:'your best hooks, never a blank page'},{t:'Weekly batching',d:'a full week scheduled in one sitting'}]}];\nconst MAP=[\n ['Lead capture','Missed calls reach voicemail; leads slip away','Instant text-back with a booking link','Choose the text-back tool'],\n ['FAQs','Answering the same 10 questions by hand','Saved auto-replies handle them','List your top 10 questions'],\n ['Scheduling','Back-and-forth emails to find a time','Auto-confirming booking links','Pick your booking tool'],\n ['Follow-up','Manual, inconsistent circle-backs','Two-message nurture sequence','Customize the scripts'],\n ['Reviews & rebooking','Forgetting to ask for testimonials','Scheduled messages that ask for you','Write the 48-hour ask'],\n ['Quote recovery','Stalled quotes go quiet','Automated 2-touch reminder','Set the reminder timing'],\n ['Invoicing','Typing invoices, chasing payments','Auto invoices + payment-due nudges','Turn on invoice drafts'],\n ['Data entry','Typing info into four different apps','One intake form fills every tool','Build the intake form'],\n ['Numbers','Living in your head','Self-updating dashboard sheet','Connect form \u2192 sheet'],\n ['Idea capture','Ideas vanish mid-errand','2-second capture spot','Install Som or a bookmark'],\n ['Content creation','Blank page every time','Hook swipe file','Save your 5 best hooks'],\n ['Publishing','Living on social media','One weekly batch session','Block 90 minutes']];\nconst PLAN=[['Choose one operational leak','15 min'],['Map the current process','20 min'],['Write the workflow or message','30 min'],['Build the smallest version','45 min'],['Test the workflow','20 min'],['Correct failures','30 min'],['Activate and document it','15 min']];\nconst SCRIPTS=[\n {tag:'Script 01 \u00b7 VoIP / Auto-attendant',title:'The After-Hours Greeting',trigger:'when a call goes unanswered after hours',\n  text:'\"Thanks for calling [Business Name]. We are currently assisting other clients, but your time is valuable. I have already sent a text message to the number you are calling from with a link to my real-time calendar so you can book a time that fits your schedule immediately. If this is urgent, please leave a brief message after the tone and I will return your call during business hours. Thank you for your interest.\"'},\n {tag:'Script 02 \u00b7 Lead nurture',title:'The 24-Hour Follow-Up Email',trigger:'24 hours after an inquiry with no action taken',\n  text:'Subject: Quick question regarding your inquiry\\n\\nHi [Client Name],\\n\\nI\\u2019m just checking in to see if you had a moment to review the booking details I sent over yesterday. I\\u2019d love to help get [mention project/topic] off the ground. Whenever you are ready, you can pick a time here: [Insert Booking Link].\\n\\nBest,\\n[Your Name]'}];\nclass Component extends DCLogic {\n constructor(props){super(props);let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}\n  this.state={\n   audit:saved.audit||Array(12).fill(null),\n   tasks:saved.tasks||Array(12).fill(false),\n   fields:(saved.fields||[0,1,2,3].map(()=>({}))).map(f=>Object.assign({current:'',automate:'',tool:'',due:'',next:'',notes:''},f)),\n   plan:(saved.plan||PLAN.map(()=>({}))).map(d=>Object.assign({done:false,action:'',notes:''},d)),\n   myScripts:saved.myScripts||['','']};}\n persist(){let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}\n  const s=this.state;try{localStorage.setItem(KEY,JSON.stringify(Object.assign(saved,{audit:s.audit,tasks:s.tasks,fields:s.fields,plan:s.plan,myScripts:s.myScripts})))}catch(e){}}\n set(p){this.setState(p,()=>this.persist());}\n renderVals(){\n  const S=this.state;\n  const answered=S.audit.filter(a=>a!==null).length;\n  const pts=S.audit.reduce((s,a)=>s+(a==='auto'?2:a==='partly'?1:0),0);\n  const scoreLine=answered?Math.round(pts/24*100)+'% independent':'______ %';\n  const TASKS=MODULES.flatMap(m=>m.tasks.map(t=>t.t));\n  const auditRows=S.audit.map((v,i)=>({label:TASKS[i],module:'M0'+(Math.floor(i/3)+1),\n   opts:['manual','partly','auto'].map(k=>({mark:v===k?'\u2713':'',bg:v===k?'#101426':'#fff',fg:'#fff',\n    on:()=>this.setState(prev=>{const a=prev.audit.slice();a[i]=a[i]===k?null:k;return{audit:a}},()=>this.persist())}))}));\n  const field=(mi,k)=>({v:S.fields[mi][k],on:(e)=>{const f=S.fields.map(o=>Object.assign({},o));f[mi][k]=e.target.value;this.set({fields:f})}});\n  const modulePages=MODULES.map((m,i)=>{const c=S.tasks.slice(i*3,i*3+3).filter(Boolean).length;\n   return{num:i+1,name:m.name,domain:m.domain,tagline:m.tagline,problem:m.problem,solution:m.solution,action:m.action,tip:m.tip,countLine:c+' of 3',\n    tasks:m.tasks.map((t,j)=>{const gi=i*3+j,on=S.tasks[gi];return{label:t.t,desc:t.d,mark:on?'\u2713':'',bg:on?'#C2501C':'#fff',fg:'#fff',\n     on:()=>this.setState(prev=>{const a=prev.tasks.slice();a[gi]=!a[gi];return{tasks:a}},()=>this.persist())}}),\n    f:{current:field(i,'current'),automate:field(i,'automate'),tool:field(i,'tool'),due:field(i,'due'),next:field(i,'next'),notes:field(i,'notes')}};});\n  const mapRows=MAP.map((r,i)=>({n:String(i+1).padStart(2,'0'),fn:r[0],cur:r[1],fut:r[2],move:r[3]}));\n  const planRows=S.plan.map((d,i)=>({n:i+1,title:PLAN[i][0],time:PLAN[i][1],action:d.action,notes:d.notes,mark:d.done?'\u2713':'',bg:d.done?'#C2501C':'#fff',fg:'#fff',\n   on:()=>this.setState(prev=>{const p=prev.plan.map(o=>Object.assign({},o));p[i].done=!p[i].done;return{plan:p}},()=>this.persist()),\n   onAction:(e)=>{const p=S.plan.map(o=>Object.assign({},o));p[i].action=e.target.value;this.set({plan:p})},\n   onNotes:(e)=>{const p=S.plan.map(o=>Object.assign({},o));p[i].notes=e.target.value;this.set({plan:p})}}));\n  const scriptPages=SCRIPTS.map((s,i)=>({tag:s.tag,title:s.title,trigger:s.trigger,original:s.text,mine:S.myScripts[i],\n   onMine:(e)=>{const m=S.myScripts.slice();m[i]=e.target.value;this.set({myScripts:m})}}));\n  return{scoreLine,auditRows,modulePages,mapRows,planRows,scriptPages};\n }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
